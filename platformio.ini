[platformio]
default_envs = lm35

[env:lm35]
platform = ststm32
board = nucleo_f411re
framework = arduino
upload_protocol = stlink
monitor_speed = 115200
extra_scripts = post:fix_ranlib.py
build_src_filter = +<lm35.cpp>

[env:hall]
extends = env:lm35
build_src_filter = +<hall.cpp>

[env:sound]
extends = env:lm35
build_src_filter = +<sound.cpp>

[env:as5048b]
extends = env:lm35
build_src_filter = +<as5048b.cpp>
monitor_speed = 921600
; bigger TX buffer so raw-mode printing doesn't stall the sample loop
build_flags = -DSERIAL_TX_BUFFER_SIZE=1024
