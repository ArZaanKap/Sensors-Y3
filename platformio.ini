[platformio]
default_envs = lm35

[env:lm35]
platform = ststm32
board = nucleo_f411re
framework = arduino
upload_protocol = stlink
monitor_speed = 115200
build_src_filter = +<lm35.cpp>

[env:hall]
extends = env:lm35
build_src_filter = +<hall.cpp>

[env:sound]
extends = env:lm35
build_src_filter = +<sound.cpp>

[env:as5048b]
extends = env:lm35
build_src_filter = +<as5048b.cpp>
