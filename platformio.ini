[platformio]
default_envs = lm35

[env:lm35]
platform = ststm32
board = nucleo_f411re
framework = arduino
upload_protocol = stlink
monitor_speed = 115200
extra_scripts = post:fix_ranlib.py
build_src_filter = +<lm35.cpp>

[env:hall]
extends = env:lm35
build_src_filter = +<hall.cpp>

[env:sound]
extends = env:lm35
build_src_filter = +<sound.cpp>

[env:as5048b]
extends = env:lm35
build_src_filter = +<as5048b.cpp>
monitor_speed = 921600
; bigger TX buffer so raw-mode printing doesn't stall the sample loop
build_flags = -DSERIAL_TX_BUFFER_SIZE=1024

[env:logger]
extends = env:lm35
build_src_filter = +<logger.cpp>

[env:fake_speed]
extends = env:lm35
build_src_filter = +<fake_speed.cpp>

[env:three_sensor_test]
extends = env:lm35
build_src_filter = +<3_sensor_test.cpp>
lib_deps = sparkfun/SparkFun Qwiic Scale NAU7802 Arduino Library

[env:logger3]
extends = env:lm35
build_src_filter = +<logger3.cpp>
build_flags = -DI2C_TIMEOUT_TICK=2
lib_deps = sparkfun/SparkFun Qwiic Scale NAU7802 Arduino Library

; Sofiya's AS5048B bring-up test (I2C line-level diagnostics), kept alongside
; the 1 kHz RPM logger in as5048b.cpp
[env:as5048b_bringup]
extends = env:lm35
build_src_filter = +<as5048b_bringup.cpp>
