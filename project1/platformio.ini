; PlatformIO project for COMP0219 Project 1 (Nucleo-F411RE)
; Build:   pio run              Upload:  pio run -t upload
; Monitor: pio device monitor

[platformio]
; Sources live directly in project1/; build_src_filter picks which file is the firmware
src_dir = .

[env:nucleo_f411re]
platform = ststm32@19.7.1  ; pinned so all teammates build with the same toolchain/framework
board = nucleo_f411re
framework = arduino
upload_protocol = stlink
monitor_speed = 115200
build_src_filter = +<strain_test.cpp>
; Default 64-byte TX buffer makes Serial.print block once a line is longer than that
build_flags = -DSERIAL_TX_BUFFER_SIZE=256
lib_deps =
    sparkfun/SparkFun Qwiic Scale NAU7802 Arduino Library@^1.0.6
